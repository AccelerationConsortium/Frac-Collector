[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frac-collector"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "godirect>=1.2.1",
    "matterlab_valves>=1.0.0",
    "pandas>=2.2.2",
    "pyserial>=3.5",
    "vpython>=7.6.5",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["lib"]
